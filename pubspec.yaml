name: neram
description: "Neram - A world clock app with mechanical flip clock animations"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  intl: ^0.19.0
  shared_preferences: ^2.3.0
  share_plus: ^10.1.4
  path_provider: ^2.1.0
  fuzzywuzzy: ^1.1.6
  uuid: ^4.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
